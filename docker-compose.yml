# Lokale Entwicklung: nur PostgreSQL läuft im Container, alle Services nativ.
services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    environment:
      POSTGRES_DB: trading_experiment
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - trading_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_experiment"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trading_pgdata:
