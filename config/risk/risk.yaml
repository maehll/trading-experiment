# VERBINDLICHE Risikolimits (Spez §7) – nur administrativ änderbar.
# Diese Datei wird ausschließlich von der Risk Engine gelesen.
# Agenten haben keinerlei Schreibzugriff auf dieses Verzeichnis.
risk:
  defaults:
    max_position_pct: 10
    max_order_pct: 5
    min_cash_pct: 10
    max_daily_loss_pct: 3
    max_drawdown_pct: 15

  agents:
    agent-a:
      overnight_positions: true
      short_selling: false
      leverage:
        enabled: false            # Freigabe erst nach separater Derivate-Policy
        max_gross_exposure_multiple: 1.0
        allowed_products: []      # leer = keine Hebelproduktklasse freigegeben
    agent-b:
      overnight_positions: false  # deterministischer EOD-Exit wird erzwungen
      short_selling: false
      leverage:
        enabled: false
    agent-c:
      overnight_positions: true
      short_selling: false
      leverage:
        enabled: false

  kill_switch:
    enabled: true
    fail_closed: true

  market_data_max_age_seconds: 120
  simulator:
    fee_bps: 10
    slippage_bps: 5
    spread_bps: 10  # Gesamter Spread um den Mittelpreis, nur ohne Bid/Ask
